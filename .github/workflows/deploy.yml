name: Deploy Vite Client to GitHub Pages

on:
  push:
    branches:
      - main  # deploys only when main branch is updated

permissions:
  contents: write  # required for gh-pages action

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout your repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ Set up Node.js environment
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3️⃣ Install all dependencies (including react-router-dom)
      - name: Install dependencies
        working-directory: client
        run: npm install

      # 4️⃣ Build the Vite project
      - name: Build Vite app
        working-directory: client
        run: npm run build

      # 5️⃣ Deploy the build folder to GitHub Pages
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: client/dist
          # optional: set custom branch (default is gh-pages)
          # publish_branch: gh-pages
